<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trailhead — Training Dashboard</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#070b14; --bg2:#0b1120; --card:#0f1729; --card2:#131d33;
    --line:#1c2740; --line2:#26344f;
    --txt:#eaf0fb; --mut:#8b98b5; --mut2:#5a6a8c;
    --acc:#22d3ee;            /* signature cyan/teal */
    --acc2:#5ee7f5;
    --blue:#3b82f6; --green:#34d8a6; --purple:#a78bfa; --yellow:#fbbf24; --red:#fb6a82;
    --pink:#f472b6; --magenta:#ec4899; --teal:#2dd4bf;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#21303f;border-radius:8px;border:2px solid var(--bg)}

  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

  /* ---- Sidebar ---- */
  .side{background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;padding:18px 14px;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px}
  .brand b{font-size:16px;letter-spacing:.2px}
  .brand small{display:block;color:var(--mut2);font-size:11px;font-weight:500;letter-spacing:.4px}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;
    padding:10px 11px;border-radius:10px;color:var(--mut);font-weight:500}
  .nav button .ic{width:18px;height:18px;flex:0 0 18px;opacity:.85}
  .nav button:hover{background:#15202d;color:var(--txt)}
  .nav button.active{background:#16222f;color:#fff}
  .nav button.active .ic{opacity:1}
  .nav button.active{box-shadow:inset 3px 0 0 var(--acc)}
  .side .spacer{flex:1}
  .syncbox{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);font-size:12px;color:var(--mut)}
  .syncbox .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;box-shadow:0 0 8px var(--green)}
  .syncbox b{color:var(--txt)}

  /* ---- Main ---- */
  .main{min-width:0;padding:26px 30px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .topbar h1{margin:0;font-size:23px;letter-spacing:.2px}
  .topbar p{margin:3px 0 0;color:var(--mut);font-size:13px}
  .avatar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    padding:6px 12px 6px 6px;border-radius:999px}
  .avatar img,.avatar .ph{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2b6cb0,#1a8d6d);
    display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
  .avatar .nm{font-size:13px;font-weight:600;line-height:1.1}
  .avatar .nm small{display:block;color:var(--mut2);font-weight:500}

  /* grid + cards */
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card.tight{padding:14px}
  .card h3{margin:0 0 2px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  .card .big{font-size:30px;font-weight:750;letter-spacing:.3px;margin-top:6px}
  .card .sub{color:var(--mut);font-size:12px;margin-top:3px}
  .delta{font-size:12px;font-weight:650;padding:2px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:3px}
  .delta.up{color:var(--green);background:rgba(55,212,154,.12)}
  .delta.down{color:var(--red);background:rgba(255,90,110,.12)}
  .delta.flat{color:var(--mut);background:#1b2735}
  .kpi-top{display:flex;align-items:center;justify-content:space-between}
  .kpi-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#16222f}
  .section-h{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
  .section-h h2{margin:0;font-size:17px}
  .section-h .link{color:var(--mut);font-size:13px;font-weight:600}
  .section-h .link:hover{color:var(--acc2)}

  /* badges / chips */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#16222f;border:1px solid var(--line2);color:var(--mut)}
  .chip.run{color:var(--acc2)}
  .chip.gym{color:var(--purple)}
  .chip.rehab{color:var(--green)}
  .chip.race{color:var(--yellow)}

  /* run/activity list */
  .alist{display:flex;flex-direction:column}
  .arow{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;padding:13px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
  .arow:last-child{border-bottom:0}
  .arow:hover{background:#15202d}
  .arow .ai{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#16222f}
  .arow .at b{font-size:14.5px}
  .arow .at small{display:block;color:var(--mut);font-size:12px;margin-top:1px}
  .arow .metrics{display:flex;gap:22px;text-align:right}
  .arow .metrics div b{font-size:14px;display:block}
  .arow .metrics div small{color:var(--mut2);font-size:11px}
  @media(max-width:680px){.arow .metrics div:nth-child(n+3){display:none}}

  table.sets{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  table.sets th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line)}
  table.sets td{padding:9px 10px;border-bottom:1px solid var(--line)}
  table.sets tr:last-child td{border-bottom:0}
  table.sets td.pr{color:var(--yellow);font-weight:700}

  .bar{height:8px;border-radius:6px;background:#1b2735;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2))}

  /* run detail */
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-size:13px;font-weight:600;background:transparent;border:0;padding:6px 4px;margin-bottom:8px}
  .back:hover{color:var(--txt)}
  .map{position:relative;width:100%;aspect-ratio:16/9;background:radial-gradient(120% 120% at 30% 20%,#13202b,#0c141d);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .map .ovl{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .splitbar{display:flex;align-items:flex-end;gap:4px;height:120px}
  .splitbar .s{flex:1;background:linear-gradient(180deg,var(--acc2),var(--acc));border-radius:5px 5px 2px 2px;position:relative;min-height:6px}
  .splitbar .s{cursor:pointer;transition:filter .1s}
  .splitbar .s:hover{filter:brightness(1.25)}
  .splitbar .s.fast{background:linear-gradient(180deg,var(--green),var(--teal))}
  .splitbar .s small{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
  .splitbar .s span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut2)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}

  /* interactive charts */
  .ichart{position:relative;width:100%;cursor:crosshair;touch-action:none}
  .ic-svg{position:absolute;inset:0}
  .ic-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.4);pointer-events:none;opacity:0;transition:opacity .08s}
  .ic-dot{position:absolute;width:11px;height:11px;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none;opacity:0;box-shadow:0 0 10px rgba(0,0,0,.5)}
  .ic-tip{position:absolute;pointer-events:none;background:#0b1120;border:1px solid var(--line2);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap;transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .08s;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .ic-tip small{color:var(--mut);font-weight:500}
  .ic-zlabel{position:absolute;right:7px;transform:translateY(-50%);font-size:10px;font-weight:800;letter-spacing:.3px;pointer-events:none;opacity:.9;text-shadow:0 1px 3px #000}
  .hovertip{position:fixed;pointer-events:none;background:#0b1120;border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .08s;z-index:60}
  .hovertip small{color:var(--mut);font-weight:500}

  /* heatmap */
  .heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
  .heat .wk{display:flex;flex-direction:column;gap:3px}
  .heat .d{width:14px;height:14px;border-radius:3px;background:#121d33;cursor:pointer}
  .heat .d:hover{outline:2px solid var(--acc2);outline-offset:1px}
  .heatscale{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);margin-top:8px}
  .heatscale .d{width:12px;height:12px;border-radius:3px}

  /* gauge */
  .gauge{position:relative;width:100%;max-width:230px;margin:0 auto}
  .gauge .val{position:absolute;left:0;right:0;bottom:8px;text-align:center}
  .gauge .val b{font-size:30px;font-weight:800;display:block;line-height:1}
  .gauge .val small{color:var(--mut);font-size:11px}

  /* header refresh button */
  .iconbtn{display:inline-grid;place-items:center;height:40px;padding:0 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-weight:600;font-size:13px;gap:7px;grid-auto-flow:column}
  .iconbtn:hover{border-color:var(--line2);background:var(--card2)}
  .iconbtn.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

  /* plan */
  .day{border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .day .dh{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:var(--card2);font-weight:700}
  .day .dh small{color:var(--mut);font-weight:500}
  .day .ex{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 15px;border-top:1px solid var(--line);font-size:13.5px}
  .day .ex small{color:var(--mut)}
  .day .ex .pres{color:var(--mut);font-variant-numeric:tabular-nums}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:6px}
  .tag.main{background:rgba(252,82,0,.15);color:var(--acc2)}
  .tag.acc{background:rgba(160,123,255,.15);color:var(--purple)}
  .tag.rehab{background:rgba(55,212,154,.15);color:var(--green)}
  .tag.done{background:rgba(55,212,154,.15);color:var(--green)}
  .tag.todo{background:#1b2735;color:var(--mut)}

  .muted{color:var(--mut)}
  .hide{display:none!important}
  .hl{color:var(--acc2);font-weight:700}

  @media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
  @media(max-width:760px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;z-index:50;left:0;top:0;width:230px;transform:translateX(-100%);transition:transform .2s}
    .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
    .main{padding:18px 16px 60px}
    .menu-btn{display:inline-grid!important}
    .g2,.g3,.g4{grid-template-columns:1fr}
  }
  .menu-btn{display:none;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
</style>
</head>

// route generator -> deterministic wandering GPS-like path in a 0..100 box
function makeRoute(seed, points, spread){
  let s = seed; const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
  let x=50+(rnd()-.5)*20, y=50+(rnd()-.5)*20, ang=rnd()*Math.PI*2;
  const pts=[[x,y]];
  for(let i=0;i<points;i++){
    ang += (rnd()-.5)*1.1;
    x += Math.cos(ang)*spread*(0.6+rnd()*0.8);
    y += Math.sin(ang)*spread*(0.6+rnd()*0.8);
    x=Math.max(8,Math.min(92,x)); y=Math.max(10,Math.min(90,y));
    pts.push([+x.toFixed(1),+y.toFixed(1)]);
  }
  return pts;
}

   LIVE DATA OVERRIDE
   fetch_garmin.py writes garmin-data.js -> window.GARMIN_DATA. Anything it
   provides replaces the sample data above. liftPlan and rehabPlan stay
   user-defined (Garmin has no concept of your custom programmes), but can be
   overridden too if present.

// Daily activity log — powers the heatmap, Trends, Records and ACWR. Sample
// data is generated deterministically; replaced by g.activityLog when live.
function genSampleLog(){
  const out=[], today=new Date(); let seed=11;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let d=125; d>=0; d--){
    const date=new Date(today); date.setDate(today.getDate()-d);
    if(rnd()<0.60){
      const gym=rnd()<0.3;
      const dist=gym?0:+(5+rnd()*25).toFixed(1);
      out.push({date:date.toISOString().slice(0,10), type:gym?'gym':'run',
        distanceKm:dist, durationSec:Math.round((gym?50:dist*5.2)*60),
        load:Math.round(gym?45+rnd()*55:dist*7+rnd()*25),
        avgHr:Math.round(132+rnd()*38), elev:Math.round(dist*rnd()*22)});
    }
  }
  return out;
}
let activityLog = genSampleLog();

let updatedAt = null;
function applyData(g){
  if (!g) return false;
  if (Array.isArray(g.activityLog) && g.activityLog.length) activityLog = g.activityLog;
  if (g.profile)        profile        = Object.assign({}, profile, g.profile);
  if (g.racePredictors) racePredictors = g.racePredictors;
  if (g.runs)           runs           = g.runs;
  if (g.oneRepMax)      oneRepMax      = g.oneRepMax;
  if (g.gymTotals)      gymTotals      = Object.assign({}, gymTotals, g.gymTotals);
  if (g.gymSessions)    gymSessions    = g.gymSessions;
  if (Array.isArray(g.liftPlan))  liftPlan.splice(0, liftPlan.length, ...g.liftPlan);
  if (g.rehabPlan)      Object.assign(rehabPlan, g.rehabPlan);
  if (g.updatedAt)      updatedAt = g.updatedAt;
  return true;
}

function lineChart(data,{w=320,h=80,color="--acc2",fill=true,min,max}={}){
  const c=cssvar(color);
  const mn=min??Math.min(...data), mx=max??Math.max(...data);
  const rng=(mx-mn)||1, pad=4;
  const X=i=>pad+i*((w-pad*2)/(data.length-1));
  const Y=v=>h-pad-((v-mn)/rng)*(h-pad*2);
  const pts=data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area=`${pad},${h-pad} ${pts} ${w-pad},${h-pad}`;
  const gid="g"+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c}" stop-opacity=".28"/><stop offset="1" stop-color="${c}" stop-opacity="0"/>
    </linearGradient></defs>
    ${fill?`<polygon points="${area}" fill="url(#${gid})"/>`:""}
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${X(data.length-1)}" cy="${Y(data[data.length-1])}" r="3.5" fill="${c}"/>
  </svg>`;
}
// Big vivid filled area chart with a smooth curve + two-tone gradient glow.
// smooth Catmull-Rom -> cubic-bezier path
function smoothPath(data,X,Y){
  let d=`M ${X(0).toFixed(1)} ${Y(data[0]).toFixed(1)}`;
  for(let i=0;i<data.length-1;i++){
    const x0=X(Math.max(0,i-1)),y0=Y(data[Math.max(0,i-1)]);
    const x1=X(i),y1=Y(data[i]);
    const x2=X(i+1),y2=Y(data[i+1]);
    const x3=X(Math.min(data.length-1,i+2)),y3=Y(data[Math.min(data.length-1,i+2)]);
    const c1x=x1+(x2-x0)/6,c1y=y1+(y2-y0)/6,c2x=x2-(x3-x1)/6,c2y=y2-(y3-y1)/6;
    d+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  }
  return d;
}

/* ---- Interactive area chart ----------------------------------------------
   interactiveChart(series, opts) returns a placeholder div; wireCharts() (run
   after each render) draws the SVG and attaches hover crosshair + tooltip.
   opts: {h, line, top, bot, min, max, zones:[{label,bpm,color}], fmt:(i,v)=>html}
   --------------------------------------------------------------------------- */
let CHARTS={};
function interactiveChart(data,opts={}){
  data=(data&&data.length)?data.slice():[0];
  if(data.length===1) data=[data[0],data[0]];
  const id="ic_"+Math.random().toString(36).slice(2,9);
  CHARTS[id]={data,opts};
  const h=opts.h||170;
  return `<div class="ichart" data-ic="${id}" style="height:${h}px">
    <div class="ic-svg"></div><div class="ic-line"></div><div class="ic-dot"></div><div class="ic-tip"></div>
  </div>`;
}
function chartSvg(data,opts,m){
  const {W,H,pad,X,Y,mn,mx}=m;
  const lc=cssvar(opts.line||"--acc2"),tc=cssvar(opts.top||opts.line||"--acc2"),bc=cssvar(opts.bot||"--blue");
  const g="g"+Math.random().toString(36).slice(2,7);
  const d=smoothPath(data,X,Y);
  const fill=`${d} L ${X(data.length-1).toFixed(1)} ${H-pad} L ${pad} ${H-pad} Z`;
  let bands="";
  (opts.zones||[]).forEach(z=>{ if(z.bpm<mn||z.bpm>mx) return;
    const y=Y(z.bpm).toFixed(1);
    bands+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="${cssvar(z.color)}" stroke-opacity=".45" stroke-width="1" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${tc}" stop-opacity=".55"/><stop offset="1" stop-color="${bc}" stop-opacity=".04"/></linearGradient>
      <linearGradient id="${g}l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${tc}"/><stop offset="1" stop-color="${lc}"/></linearGradient></defs>
    ${bands}
    <path d="${fill}" fill="url(#${g})"/>
    <path d="${d}" fill="none" stroke="url(#${g}l)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}
function wireCharts(){
  document.querySelectorAll('[data-ic]').forEach(el=>{
    const cfg=CHARTS[el.getAttribute('data-ic')]; if(!cfg) return;
    const {data,opts}=cfg, W=600, H=opts.h||170, pad=6;
    const mn=opts.min??Math.min(...data), mx=opts.max??Math.max(...data), rng=(mx-mn)||1;
    const X=i=>pad+i*((W-pad*2)/(data.length-1));
    const Y=v=>H-pad-((v-mn)/rng)*(H-pad*2);
    el.querySelector('.ic-svg').innerHTML=chartSvg(data,opts,{W,H,pad,X,Y,mn,mx,rng});
    // zone labels as (non-stretched) DOM so text isn't distorted
    el.querySelectorAll('.ic-zlabel').forEach(n=>n.remove());
    (opts.zones||[]).forEach(z=>{ if(z.bpm<mn||z.bpm>mx) return;
      const lbl=document.createElement('div'); lbl.className='ic-zlabel';
      lbl.textContent=z.label; lbl.style.top=(Y(z.bpm)/H*100)+'%'; lbl.style.color=cssvar(z.color);
      el.appendChild(lbl);
    });
    const line=el.querySelector('.ic-line'),dot=el.querySelector('.ic-dot'),tip=el.querySelector('.ic-tip');
    dot.style.background=cssvar(opts.line||opts.top||'--acc2');
    const move=ev=>{
      const r=el.getBoundingClientRect();
      const cx=('touches' in ev && ev.touches[0]?ev.touches[0].clientX:ev.clientX);
      const x0=pad/W*r.width, x1=(W-pad)/W*r.width;
      let frac=(cx-r.left-x0)/((x1-x0)||1); frac=Math.min(1,Math.max(0,frac));
      const i=Math.round(frac*(data.length-1));
      const xpx=X(i)/W*r.width, ypx=Y(data[i])/H*r.height;
      line.style.left=xpx+'px'; dot.style.left=xpx+'px'; dot.style.top=ypx+'px';
      tip.style.left=Math.min(r.width-60,Math.max(60,xpx))+'px'; tip.style.top=ypx+'px';
      tip.innerHTML=opts.fmt?opts.fmt(i,data[i]):`${data[i]}${opts.unit||''}`;
      line.style.opacity=dot.style.opacity=tip.style.opacity=1;
    };
    const hide=()=>{line.style.opacity=dot.style.opacity=tip.style.opacity=0;};
    el.onmousemove=move; el.onmouseleave=hide;
    el.ontouchstart=move; el.ontouchmove=ev=>{ev.preventDefault();move(ev);}; el.ontouchend=hide;
  });
}
// HR zone thresholds (lower bound of each zone) from a max HR
function hrZonesFor(maxHr){
  const m=Math.max(maxHr||0,185);
  return [{label:"Z2",bpm:Math.round(m*.70),color:"--green"},
          {label:"Z3",bpm:Math.round(m*.80),color:"--yellow"},
          {label:"Z4",bpm:Math.round(m*.90),color:"--pink"},
          {label:"Z5",bpm:Math.round(m*.95),color:"--red"}];
}
function zoneOf(bpm,zones){ let z="Z1"; zones.forEach(t=>{ if(bpm>=t.bpm) z=t.label; }); return z; }

/* =========================================================================
   ANALYTICS HELPERS (heatmap, weekly aggregation, ACWR, records)
   ========================================================================= */
const DAY=86400000;
function ymd(d){ return d.toISOString().slice(0,10); }
function logByDate(){ const m={}; activityLog.forEach(a=>{ (m[a.date]=m[a.date]||[]).push(a); }); return m; }

// GitHub-style training heatmap: `weeks` columns (Mon–Sun rows), colored by daily load.
function heatmap(weeks=17){
  const by=logByDate();
  const today=new Date(); today.setHours(0,0,0,0);
  // back up to the most recent Sunday so columns are whole weeks
  const end=new Date(today); end.setDate(end.getDate()+(7-end.getDay())%7);
  const start=new Date(end); start.setDate(start.getDate()-weeks*7+1);
  let maxLoad=1; activityLog.forEach(a=>{ maxLoad=Math.max(maxLoad,a.load||0); });
  const shade=v=>{ if(!v) return "#121d33";
    const t=Math.min(1,v/(maxLoad*0.9)); const a=(0.18+0.82*t).toFixed(2);
    return `rgba(45,212,191,${a})`; };
  let cols="";
  for(let w=0; w<weeks; w++){
    let cells="";
    for(let dch=0; dch<7; dch++){
      const dt=new Date(start); dt.setDate(start.getDate()+w*7+dch);
      const key=ymd(dt), acts=by[key]||[];
      const load=acts.reduce((s,a)=>s+(a.load||0),0);
      const dist=acts.reduce((s,a)=>s+(a.distanceKm||0),0);
      const future=dt>today;
      const tip = future ? "" :
        `${dt.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}` +
        (acts.length?` · <small>${dist?dist.toFixed(1)+' km · ':''}load ${load}</small>`:` · <small>rest</small>`);
      cells+=`<div class="d" ${tip?`data-tip="${tip}"`:''} style="background:${future?'transparent':shade(load)}"></div>`;
    }
    cols+=`<div class="wk">${cells}</div>`;
  }
  return `<div class="heat">${cols}</div>
    <div class="heatscale"><span>Less</span>
      <div class="d" style="background:#121d33"></div>
      <div class="d" style="background:rgba(45,212,191,.3)"></div>
      <div class="d" style="background:rgba(45,212,191,.6)"></div>
      <div class="d" style="background:rgba(45,212,191,.9)"></div>
      <span>More</span></div>`;
}

// weekly aggregation of the log -> [{week, dist, load, count, paceMin}]
function weekly(nWeeks=12){
  const today=new Date(); today.setHours(0,0,0,0);
  const monday=new Date(today); monday.setDate(today.getDate()-((today.getDay()+6)%7));
  const buckets=[];
  for(let i=nWeeks-1;i>=0;i--){
    const ws=new Date(monday); ws.setDate(monday.getDate()-i*7);
    const we=new Date(ws); we.setDate(ws.getDate()+7);
    let dist=0,load=0,count=0,dur=0,rdist=0;
    activityLog.forEach(a=>{ const d=new Date(a.date);
      if(d>=ws&&d<we){ dist+=a.distanceKm||0; load+=a.load||0; count++;
        if(a.type==='run'){ dur+=a.durationSec||0; rdist+=a.distanceKm||0; } }});
    buckets.push({label:ws.toLocaleDateString(undefined,{day:'numeric',month:'short'}),
      dist:+dist.toFixed(1), load:Math.round(load), count,
      paceMin: rdist? (dur/60)/rdist : 0});
  }
  return buckets;
}

// Acute:Chronic Workload Ratio — acute = last 7d load, chronic = avg weekly over 28d
function acwr(){
  const now=Date.now(); let acute=0, chronic=0;
  activityLog.forEach(a=>{ const age=(now-new Date(a.date).getTime())/DAY;
    if(age<7) acute+=a.load||0;
    if(age<28) chronic+=a.load||0; });
  chronic=chronic/4;
  const ratio = chronic? acute/chronic : 0;
  let band,col;
  if(ratio<0.8){ band="Undertraining"; col="--blue"; }
  else if(ratio<=1.3){ band="Optimal"; col="--green"; }
  else if(ratio<=1.5){ band="Caution"; col="--yellow"; }
  else { band="High risk"; col="--red"; }
  return {ratio:+ratio.toFixed(2), acute:Math.round(acute), chronic:Math.round(chronic), band, col};
}

function records(){
  const runsLog=activityLog.filter(a=>a.type==='run'&&a.distanceKm>0);
  const longest=runsLog.reduce((m,a)=>a.distanceKm>(m?.distanceKm||0)?a:m,null);
  const climb=runsLog.reduce((m,a)=>(a.elev||0)>(m?.elev||0)?a:m,null);
  const longestT=runsLog.reduce((m,a)=>(a.durationSec||0)>(m?.durationSec||0)?a:m,null);
  const fastest=runsLog.filter(a=>a.distanceKm>=3)
    .reduce((m,a)=>{ const p=(a.durationSec/60)/a.distanceKm; return p<(m?.p||1e9)?{...a,p}:m; },null);
  const wk=weekly(20).reduce((m,w)=>w.dist>(m?.dist||0)?w:m,null);
  return {longest,climb,longestT,fastest,bigWeek:wk};
}

// gauge: semicircle dial 0..2 for ACWR
function acwrGauge(a){
  const W=240,H=140,cx=120,cy=125,r=100, max=2;
  const ang=Math.PI*(1 - Math.min(max,a.ratio)/max);     // pi..0
  const px=cx+r*Math.cos(ang), py=cy-r*Math.sin(ang);
  const arc=(from,to,col)=>{ const a0=Math.PI*(1-from/max),a1=Math.PI*(1-to/max);
    const x0=cx+r*Math.cos(a0),y0=cy-r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy-r*Math.sin(a1);
    return `<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${cssvar(col)}" stroke-width="12" stroke-linecap="round" opacity=".85"/>`; };
  return `<div class="gauge"><svg viewBox="0 0 ${W} ${H}" style="width:100%">
      ${arc(0,0.8,'--blue')}${arc(0.8,1.3,'--green')}${arc(1.3,1.5,'--yellow')}${arc(1.5,2,'--red')}
      <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="8" fill="#fff"/>
    </svg><div class="val"><b style="color:${cssvar(a.col)}">${a.ratio.toFixed(2)}</b><small>${a.band} · acute ${a.acute} / chronic ${a.chronic}</small></div></div>`;
}
function barChart(data,{w=320,h=90,color="--acc2"}={}){
  const c=cssvar(color), mx=Math.max(...data)||1, n=data.length, gap=3;
  const bw=(w-(n-1)*gap)/n;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
    ${data.map((v,i)=>{const bh=Math.max(3,(v/mx)*(h-6));return `<rect x="${(i*(bw+gap)).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${c}" opacity="${.55+.45*(v/mx)}"/>`}).join("")}
  </svg>`;
}
function donut(segments,{size=120,thick=14}={}){
  const r=(size-thick)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const total=segments.reduce((a,s)=>a+s.v,0)||1; let off=0;
  const arcs=segments.map(s=>{const len=(s.v/total)*C;const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cssvar(s.c)}" stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;off+=len;return el}).join("");
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1b2735" stroke-width="${thick}"/>${arcs}</svg>`;
}

/* =========================================================================
   ROUTE MAP
   ========================================================================= */
let ROUTES={};
function routeMap(route,chips=[],meta={}){
  // map 0..100 coords to a 800x450 viewbox
  const W=800,H=450, mx=W/100, my=H/100;
  const path=route.map((p,i)=>`${i?'L':'M'}${(p[0]*mx).toFixed(1)} ${(p[1]*my).toFixed(1)}`).join(" ");
  const start=route[0], end=route[route.length-1];
  const id="rt_"+Math.random().toString(36).slice(2,8);
  ROUTES[id]={route,meta,W,H,mx,my};
  // faint grid to read as a map
  let grid="";
  for(let i=1;i<10;i++){grid+=`<line x1="${i*80}" y1="0" x2="${i*80}" y2="${H}"/><line x1="0" y1="${i*45}" x2="${W}" y2="${i*45}"/>`}
  return `<div class="map" data-route="${id}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
      <defs><linearGradient id="rt" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${cssvar('--green')}"/><stop offset="1" stop-color="${cssvar('--teal')}"/>
      </linearGradient></defs>
      <g stroke="#152138" stroke-width="1">${grid}</g>
      <path d="${path}" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${path}" fill="none" stroke="url(#rt)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px ${cssvar('--teal')}80)"/>
      <circle cx="${(start[0]*mx).toFixed(1)}" cy="${(start[1]*my).toFixed(1)}" r="9" fill="${cssvar('--green')}" stroke="#070b14" stroke-width="3"/>
      <circle cx="${(end[0]*mx).toFixed(1)}" cy="${(end[1]*my).toFixed(1)}" r="9" fill="${cssvar('--red')}" stroke="#070b14" stroke-width="3"/>
      <circle class="rt-dot" cx="0" cy="0" r="8" fill="#fff" opacity="0"/>
    </svg>
    <div class="ovl">${chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
    <div class="ic-tip rt-tip"></div>
  </div>`;
}
function wireRoutes(){
  document.querySelectorAll('[data-route]').forEach(el=>{
    const cfg=ROUTES[el.getAttribute('data-route')]; if(!cfg) return;
    const {route,meta,W,H,mx,my}=cfg;
    const svg=el.querySelector('svg'), dot=el.querySelector('.rt-dot'), tip=el.querySelector('.rt-tip');
    const move=ev=>{
      const r=svg.getBoundingClientRect();
      const cx=('touches'in ev&&ev.touches[0]?ev.touches[0].clientX:ev.clientX)-r.left;
      const cy=('touches'in ev&&ev.touches[0]?ev.touches[0].clientY:ev.clientY)-r.top;
      // viewBox uses slice scaling: scale = max(r.w/W, r.h/H), centered
      const sc=Math.max(r.width/W,r.height/H);
      const vx=(cx-(r.width-W*sc)/2)/sc, vy=(cy-(r.height-H*sc)/2)/sc;
      let best=0,bd=1e18;
      route.forEach((p,i)=>{ const dx=p[0]*mx-vx, dy=p[1]*my-vy, d=dx*dx+dy*dy; if(d<bd){bd=d;best=i;} });
      const p=route[best], frac=best/(route.length-1);
      dot.setAttribute('cx',(p[0]*mx).toFixed(1)); dot.setAttribute('cy',(p[1]*my).toFixed(1)); dot.setAttribute('opacity','1');
      const km=meta.dist?(frac*meta.dist).toFixed(2)+' km':'';
      const hr=(meta.hr&&meta.hr.length)?meta.hr[Math.round(frac*(meta.hr.length-1))]+' bpm':'';
      tip.innerHTML=[km,hr].filter(Boolean).map((t,i)=>i?`<small>${t}</small>`:t).join(' · ')||'—';
      tip.style.left=(p[0]*mx*sc+(r.width-W*sc)/2)+'px';
      tip.style.top=(p[1]*my*sc+(r.height-H*sc)/2)+'px';
      tip.style.opacity=1;
    };
    const hide=()=>{dot.setAttribute('opacity','0'); tip.style.opacity=0;};
    el.onmousemove=move; el.onmouseleave=hide;
    el.ontouchstart=move; el.ontouchmove=ev=>{ev.preventDefault();move(ev);}; el.ontouchend=hide;
  });
}

/* =========================================================================

   ========================================================================= */
const paceStr=m=>{const t=Math.floor(m),s=Math.round((m-t)*60);return `${t}:${String(s).padStart(2,'0')}`};
function deltaBadge(cur,prev,{invert=false,suffix=""}={}){
  const d=cur-prev; if(Math.abs(d)<1e-9) return `<span class="delta flat">—</span>`;
  const good = invert ? d<0 : d>0;
  const arrow = d>0?"▲":"▼";
  const cls = good?"up":"down";
  const val = (d>0?"+":"")+(Number.isInteger(d)?d:d.toFixed(1))+suffix;
  return `<span class="delta ${cls}">${arrow} ${val}</span>`;
}

  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <h3>Elevation</h3>
      <div style="margin-top:10px">${interactiveChart(a.elevProfile,{h:150,line:'--green',top:'--green',bot:'--teal',
        fmt:(i,v)=>`${v} <small>m</small> <small>· ${(i/(a.elevProfile.length-1)*a.distance).toFixed(1)} km</small>`})}</div>
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--green)"></i>Metres · total climb ${a.elev} m</span></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><h3>Splits (per km)</h3>
        <span class="muted" style="font-size:12px">Fastest ${paceStr(fastest)} · Slowest ${paceStr(slowest)}</span></div>
      <div class="splitbar" style="margin-top:26px;margin-bottom:22px">${splitBars}</div>
    </div>
  </div>`;
}

function viewGym(){
  const cards=oneRepMax.map(l=>{
    const pct=Math.min(100,Math.round(l.current/l.goal*100));
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div><h3>${l.lift}</h3><div class="big">${l.current}<span class="muted" style="font-size:14px;font-weight:500"> ${l.unit}</span></div></div>
        ${deltaBadge(l.current,l.prev,{suffix:" kg"})}
      </div>
      <div style="margin:8px 0 4px">${lineChart(l.history,{h:54,color:l.color})}</div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px"><span>Goal ${l.goal} ${l.unit}</span><span>${pct}%</span></div>
      <div class="bar"><i style="width:${pct}%;background:linear-gradient(90deg,${cssvar(l.color)},${cssvar(l.color)})"></i></div>
    </div>`;
  }).join("");

  const sessions=gymSessions.map(activityRow).join("");
  return `
  <div class="grid g4">
    <div class="card tight"><h3>Total Sessions</h3><div class="big" style="font-size:24px">${gymTotals.sessions}</div><div class="sub">${gymTotals.sessionsThisMonth} this month</div></div>
    <div class="card tight"><h3>Volume / week</h3><div class="big" style="font-size:24px">${(gymTotals.volumeWeek/1000).toFixed(1)} t</div><div class="sub">${deltaBadge(gymTotals.volumeWeek,gymTotals.volumeWeekPrev,{suffix:'kg'})}</div></div>
    <div class="card tight"><h3>Sets / week</h3><div class="big" style="font-size:24px">${gymTotals.setsWeek}</div><div class="sub">across 4 sessions</div></div>
    <div class="card tight"><h3>PRs this month</h3><div class="big" style="font-size:24px">${gymTotals.prsThisMonth} 🏆</div><div class="sub">new 1RMs</div></div>
  </div>

  <div class="section-h"><h2>Current 1 Rep Max</h2><span class="muted" style="font-size:13px">Estimated from working sets (Epley)</span></div>
  <div class="grid g4">${cards}</div>

  <div class="section-h"><h2>Session log</h2><span class="muted" style="font-size:13px">Click a session for the full set log</span></div>
  <div class="card tight"><div class="alist">${sessions}</div></div>`;
}

function viewGymSession(s){
  const ex=s.exercises.map(e=>{
    const best=e.sets.reduce((a,b)=>b[0]>a[0]?b:a,[0,0]);
    const e1rm=Math.round(best[0]*(1+best[1]/30)); // Epley
    const rows=e.sets.map((set,i)=>`<tr><td>${i+1}</td><td>${set[0]} kg</td><td>${set[1]}</td><td class="${e.pr&&i===0?'pr':''}">${Math.round(set[0]*(1+set[1]/30))} kg${e.pr&&i===0?' 🏆':''}</td></tr>`).join("");
    return `<div class="card" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b style="font-size:15px">${e.name} ${e.pr?'<span class="tag main">PR</span>':''}</b>
        <span class="muted" style="font-size:12px">Top est. 1RM <b style="color:var(--txt)">${e1rm} kg</b></span></div>
      <table class="sets"><thead><tr><th>Set</th><th>Weight</th><th>Reps</th><th>Est. 1RM</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }).join("");
  return `
  <button class="back" data-view="gym">← Back to sessions</button>
  <div style="display:flex;align-items:center;gap:12px;margin:4px 0 16px;flex-wrap:wrap">
    <div class="kpi-ic" style="width:44px;height:44px">${ic('gym',cssvar('--purple'))}</div>
    <div><h2 style="margin:0">${s.title}</h2><div class="muted" style="font-size:13px">${s.date} · ${s.duration}</div></div>
  </div>
  <div class="grid g4">
    <div class="card tight"><h3>Volume</h3><div class="big" style="font-size:22px">${(s.volume/1000).toFixed(1)} t</div><div class="sub">${s.tonnageNote}</div></div>
    <div class="card tight"><h3>Total Sets</h3><div class="big" style="font-size:22px">${s.sets}</div></div>
    <div class="card tight"><h3>Exercises</h3><div class="big" style="font-size:22px">${s.exercises.length}</div></div>
    <div class="card tight"><h3>Duration</h3><div class="big" style="font-size:22px">${s.duration}</div></div>
  </div>
  <div class="section-h"><h2>Set log</h2></div>
  ${ex}`;
}

function viewPlan(){
  const done=liftPlan.filter(d=>d.done).length;
  const days=liftPlan.map(d=>{
    const tagClass=d.tag;
    const items=d.items.map(it=>`<div class="ex"><span>${it[0]}</span><span class="pres">${it[1]}</span></div>`).join("");
    return `<div class="day">
      <div class="dh"><div>${d.day} <span class="tag ${tagClass}">${d.focus}</span></div>
        <span class="tag ${d.done?'done':'todo'}">${d.done?'✓ Done':'Planned'}</span></div>
      ${items}</div>`;
  }).join("");
  return `
  <div class="grid g3">
    <div class="card tight"><h3>Programme</h3><div class="big" style="font-size:22px">Marathon + Strength</div><div class="sub">Concurrent · 12-week block</div></div>
    <div class="card tight"><h3>Week progress</h3><div class="big" style="font-size:22px">${done}/7 days</div><div class="bar" style="margin-top:8px"><i style="width:${Math.round(done/7*100)}%"></i></div></div>
    <div class="card tight"><h3>Phase</h3><div class="big" style="font-size:22px">Build · Wk 7</div><div class="sub">Deload in 2 weeks</div></div>
  </div>
  <div class="section-h"><h2>This week</h2><span class="muted" style="font-size:13px">Auto-syncs completed lifts from Garmin</span></div>
  <div class="grid g2">${days}</div>`;
}

function viewRehab(){
  const r=rehabPlan;
  const blocks=r.blocks.map(b=>{
    const items=b.items.map(it=>`<div class="ex"><div><span>${it[0]}</span><br><small>${it[2]}</small></div><span class="pres">${it[1]}</span></div>`).join("");
    return `<div class="day"><div class="dh"><div><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${cssvar(b.color)};margin-right:8px"></span>${b.name}</div></div>${items}</div>`;
  }).join("");
  return `
  <div class="grid g3">
    <div class="card tight"><h3>Focus area</h3><div class="big" style="font-size:20px">${r.area}</div><div class="sub">${r.phase}</div></div>
    <div class="card tight"><h3>Adherence</h3><div class="big" style="font-size:22px">${r.adherence}%</div><div class="bar" style="margin-top:8px"><i style="width:${r.adherence}%;background:linear-gradient(90deg,var(--green),var(--green))"></i></div></div>
    <div class="card tight"><h3>Pain (0–10)</h3><div class="big" style="font-size:22px">1 / 10</div><div class="sub">↓ from 4 at start</div></div>
  </div>
  <div class="section-h"><h2>Protocol</h2><span class="muted" style="font-size:13px">Built around your return-to-run timeline</span></div>
  <div class="grid g3">${blocks}</div>
  <div class="card" style="margin-top:16px">
    <h3>Return-to-run progression</h3>
    <div class="grid g4" style="margin-top:10px">
      <div class="card tight" style="text-align:center"><div class="big" style="font-size:18px">Walk/Run</div><span class="tag done">Wk 1–2 ✓</span></div>
      <div class="card tight" style="text-align:center"><div class="big" style="font-size:18px">Easy Z2</div><span class="tag done">Wk 3–4 ✓</span></div>
      <div class="card tight" style="text-align:center"><div class="big" style="font-size:18px">Tempo</div><span class="tag main">Wk 5–6 ●</span></div>
      <div class="card tight" style="text-align:center"><div class="big" style="font-size:18px">Full load</div><span class="tag todo">Wk 7+</span></div>
    </div>
  </div>`;
}

/* =========================================================================
   ROUTER
   ========================================================================= */
let current="overview";
function render(view,payload){
  current=view;
  // nav highlight (only for top-level views)
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const navLabels={overview:'Overview',running:'Running',gym:'Strength',plan:'Lift Plan',rehab:'Rehab'};
  const top=titles[view]||titles[payload?.__parent]||["",""];
  if(titles[view]){document.getElementById('pageTitle').textContent=top[0];document.getElementById('pageSub').textContent=top[1];}
  CHARTS={}; ROUTES={};
  let html="";
  switch(view){
    case "overview": html=viewOverview(); break;
    case "running":  html=viewRunning(); break;
    case "trends":   html=viewTrends(); break;
    case "run":      html=viewRun(payload); document.getElementById('pageTitle').textContent="Activity"; document.getElementById('pageSub').textContent="Full run breakdown"; break;
    case "gym":      html=viewGym(); break;
    case "gymSession":html=viewGymSession(payload); document.getElementById('pageTitle').textContent="Session"; document.getElementById('pageSub').textContent="Strength session log"; break;
    case "plan":     html=viewPlan(); break;
    case "rehab":    html=viewRehab(); break;
    default: html=viewOverview();
  }
  viewEl.innerHTML=html;
  wireCharts(); wireRoutes();
  window.scrollTo({top:0,behavior:"instant"});
  document.getElementById('side').classList.remove('open');
}

// nav labels (icons + text)
(function setupNav(){
  const labels=[["overview","Overview"],["running","Running"],["trends","Trends"],["gym","Strength"],["plan","Lift Plan"],["rehab","Rehab"]];
  document.querySelectorAll('#nav button').forEach((b,i)=>{
    const [v,t]=labels[i]; b.dataset.view=v; b.innerHTML=ic(v)+`<span>${t}</span>`;
  });
})();

// event delegation
document.addEventListener('click',e=>{
  const navBtn=e.target.closest('[data-view]');
  if(navBtn){ render(navBtn.dataset.view); return; }
  const act=e.target.closest('[data-activity]');
  if(act){
    const id=act.dataset.activity;
    const run=runs.find(r=>r.id===id);
    if(run){ render("run",run); return; }
    const sess=gymSessions.find(g=>g.id===id);
    if(sess){ render("gymSession",sess); return; }
  }
});
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('side').classList.toggle('open'));

// generic hover tooltip for any element with [data-tip]
(function(){
  const tip=document.createElement('div'); tip.className='hovertip'; document.body.appendChild(tip);
  document.addEventListener('mousemove',e=>{
    const t=e.target.closest('[data-tip]');
    if(!t){ tip.style.opacity=0; return; }
    tip.innerHTML=t.getAttribute('data-tip');
    tip.style.left=e.clientX+'px'; tip.style.top=(e.clientY-6)+'px'; tip.style.opacity=1;
  },{passive:true});
})();

// ---- sync label + live polling -------------------------------------------
function relTime(iso){
  if(!iso) return "—";
  const diff=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(diff<60) return "just now";
  if(diff<3600) return Math.floor(diff/60)+" min ago";
  if(diff<86400) return Math.floor(diff/3600)+"h ago";
  return Math.floor(diff/86400)+"d ago";
}
function updateSyncLabel(){
  document.getElementById('syncTime').textContent = updatedAt ? relTime(updatedAt) : "just now";
}
setInterval(()=>updateSyncLabel(), 30000);

// When served by serve.py, poll /api/data so the page updates itself live.
// When opened as a plain file, this just no-ops and the static data stays.
let liveOn=false;
async function poll(){
  try{
    const res=await fetch('api/data',{cache:'no-store'});
    if(!res.ok) return;
    const j=await res.json();
    if(j && j.data && Object.keys(j.data).length){
      const before=updatedAt;
      applyData(j.data);
      if(!liveOn){ liveOn=true; document.getElementById('aviSub').textContent="Live · auto-refresh"; }
      if(updatedAt!==before){ render(current); }   // re-render only when data actually changed
      updateSyncLabel(true);
    }
  }catch(e){ /* no server (opened as file) — stay on static data */ }
}
if(location.protocol.startsWith('http')){
  poll();                       // initial live pull
  setInterval(poll, 60000);     // check every minute (server refetches Garmin every ~15)
}

// Refresh button: when served by serve.py, ask the server to re-pull from Garmin
// now; when opened as a plain file, just reload the page.
document.getElementById('refreshBtn').addEventListener('click',async()=>{
  const btn=document.getElementById('refreshBtn'); btn.classList.add('spin');
  if(location.protocol.startsWith('http')){
    try{ await fetch('api/refresh',{method:'POST'}); }catch(e){}
    let n=0; const iv=setInterval(async()=>{ await poll(); if(++n>=8){ clearInterval(iv); btn.classList.remove('spin'); } },2500);
  } else {
    location.reload();
  }
});

updateSyncLabel();
render("overview");
</script>
